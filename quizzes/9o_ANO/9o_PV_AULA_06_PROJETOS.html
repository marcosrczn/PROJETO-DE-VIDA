<title>Se a Escola Fosse Nossa</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#1f2937;--mute:#5b6572;--acc:#0b6b78;--acc2:#e0f1f2;--warm:#d9731f;--ok:#1d7a46;--okbg:#e4f5ea;--bad:#b3341f;--badbg:#fbe9e5;--line:#d6dde1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a1e;--card:#18242a;--ink:#e6edf0;--mute:#9fb0b8;--acc:#4fc1cf;--acc2:#18363b;--warm:#f0a35c;--ok:#5fd18e;--okbg:#173527;--bad:#f08a76;--badbg:#3a1e19;--line:#2c3d44}}
:root[data-theme="dark"]{--bg:#111a1e;--card:#18242a;--ink:#e6edf0;--mute:#9fb0b8;--acc:#4fc1cf;--acc2:#18363b;--warm:#f0a35c;--ok:#5fd18e;--okbg:#173527;--bad:#f08a76;--badbg:#3a1e19;--line:#2c3d44}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Arial,sans-serif}
html.nb body{-webkit-user-select:none;user-select:none}
html.nb input,html.nb textarea{-webkit-user-select:text;user-select:text}
@media print{html.nb body{display:none!important}}
header{background:var(--acc);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
nav button{flex:1;min-width:110px;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-weight:600;cursor:pointer}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{padding:10px 16px;border-radius:10px;border:0;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;font-size:.95rem}
.btn.sec{background:var(--acc2);color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.sec h2{color:var(--acc);margin:0 0 8px;font-size:1.15rem}
.lem{background:var(--acc2);border-left:4px solid var(--acc);padding:10px 12px;border-radius:8px;margin-top:10px}
.lem b{color:var(--acc)}
.hl{outline:3px solid var(--warm);outline-offset:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bdg{padding:4px 10px;border-radius:99px;background:var(--acc2);font-size:.85rem;font-weight:600}
.bdg.e{background:var(--badbg);color:var(--bad)}.bdg.r{background:var(--okbg);color:var(--ok)}.bdg.r.w{background:#fdf0e1;color:#9a4d0c}
.tag{display:inline-block;background:var(--warm);color:#fff;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
.qn{font-size:.85rem;color:var(--mute);font-weight:700}
.qt{font-size:1.08rem;font-weight:600;margin:6px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt .l{font-weight:700;color:var(--acc);min-width:20px}
.opt.dis{pointer-events:none;opacity:.8}.opt.right{border-color:var(--ok);background:var(--okbg)}
.timer{font-size:.9rem;color:var(--mute);margin:8px 0}
.fb{border-radius:10px;padding:12px;margin-top:12px}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
label.f{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:1rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
#ov{position:fixed;inset:0;background:rgba(10,20,25,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#ov .box{background:var(--card);color:var(--ink);max-width:520px;width:100%;border-radius:14px;padding:22px;text-align:center}
#ov .big{font-size:2.4rem;font-weight:700;color:var(--acc)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bad);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90%}
#banner{display:none;background:var(--warm);color:#fff;text-align:center;padding:8px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}th{color:var(--acc)}
footer{text-align:center;padding:24px 16px;color:var(--mute);font-size:.8rem}
footer a{color:var(--mute);cursor:pointer;text-decoration:underline}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}.kv b{color:var(--mute);font-weight:600}
.qc{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.qc .c{color:var(--ok);font-weight:700}
.hidden{display:none!important}
.ins{font-size:.88rem;color:var(--mute);margin:-4px 0 8px}
.drop{min-height:64px;border:2px dashed var(--acc);border-radius:12px;padding:8px;margin:0 0 12px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:var(--bg);transition:background .15s}
.drop.over{background:var(--acc2)}.drop .chip{width:100%;margin:0;color:var(--ink);border-color:var(--acc);background:var(--acc2)}
.chip{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--card);cursor:grab;touch-action:none}
.chip:hover{border-color:var(--acc)}.chip .l{font-weight:700;color:var(--acc);min-width:20px}.chip .g{margin-left:auto;color:var(--mute);letter-spacing:-2px}
.chip.dis{cursor:default;opacity:.85}.chip.right{border-color:var(--ok);background:var(--okbg)}
.chip.ghost{position:fixed;z-index:70;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);margin:0}
.chip.lift{opacity:.35}
</style>

<script>
(function(){
const D={"titulo":"Se a escola fosse nossa: de reclamar a propor","cab":"Projeto de Vida · 9º ano do Ensino Fundamental · 3º trimestre · Aula 06","secs":[{"t":"1. Reclamar ou propor?","ps":["Todo mundo tem alguma coisa que incomoda na escola: o banheiro, a fila da merenda, o calor, o barulho. Perceber esses problemas é bom, porque mostra que você presta atenção no lugar onde vive.","Mas existe uma diferença grande entre reclamar e propor. Reclamar é dizer que algo está ruim: \"o bebedouro está quebrado e ninguém faz nada\". Propor é dizer o que pode ser feito: \"vamos avisar a direção qual bebedouro é, desde quando está quebrado, e pedir um prazo para o conserto\".","Quem propõe fala de um problema concreto, e não de \"tudo\". Frases como \"nada presta\" não ajudam ninguém a agir. Frases como \"faltam lixeiras no pátio\" já mostram por onde começar.","Agir para melhorar o lugar onde a gente vive se chama protagonismo. Um jovem levou luz a casas sem energia usando garrafas PET com água. Ele não tinha dinheiro: tinha atenção ao problema e uma ideia simples."],"lembrar":"Reclamar aponta o problema. Propor aponta o problema e o que fazer. Quanto mais concreto, melhor."},{"t":"2. Olhar a escola com atenção","ps":["Nem sempre o que me incomoda é o que mais incomoda a escola. Antes de propor, vale descobrir o que as outras pessoas pensam.","Dá para fazer isso de três jeitos: perguntar (conversar ou entregar perguntas curtas), observar (olhar com calma o que acontece no pátio, na fila, na biblioteca) e contar (anotar quantas vezes algo acontece).","Ouça também quem trabalha na escola: merendeiras, porteiros, pessoal da limpeza, professores. Eles veem problemas que os estudantes nem percebem.","A observação ajuda a achar a causa verdadeira. Às vezes ninguém vai à biblioteca não por falta de interesse, mas porque ela abre tarde."],"lembrar":"Pergunte, observe e conte. Ouça estudantes e funcionários. Procure a causa verdadeira."},{"t":"3. Está ao nosso alcance?","ps":["Alguns problemas os estudantes conseguem resolver: diminuir o lixo no pátio, organizar a fila, cuidar de um canteiro. Outros dependem de dinheiro ou de decisões de adultos, como trocar o telhado ou construir um muro.","Quando o problema é grande demais, não precisa desistir. Dá para fazer um pedido educado e bem explicado à direção e, enquanto isso, fazer a parte que está ao nosso alcance.","Um problema muito grande, como a violência no bairro, pode ter um primeiro passo pequeno e possível dentro da escola.","Pedido educado funciona melhor do que ameaça ou xingamento. Quem recebe uma mensagem respeitosa e clara tem mais vontade de ajudar."],"lembrar":"Foque no que a turma consegue fazer. O que não está ao alcance vira um pedido educado e bem explicado."},{"t":"4. Uma proposta que dá para conferir","ps":["\"Melhorar o recreio\" é uma intenção bonita, mas ninguém consegue dizer se deu certo. Uma boa proposta tem número e prazo.","Exemplo: o pátio tem cerca de 40 embalagens no chão depois de cada recreio. Um objetivo que dá para conferir é \"chegar a no máximo 20 embalagens em dois meses\".","Para comparar, é preciso medir antes de começar e medir de novo no final. Sem a medida inicial, não dá para saber se algo mudou.","Se o resultado ficou perto, mas não chegou ao número, o projeto não fracassou: é hora de ver o que funcionou, o que faltou e ajustar."],"lembrar":"Objetivo bom tem número e prazo. Meça antes e depois. Se não chegou lá, ajuste."},{"t":"5. Quem faz o quê e quando","ps":["Ideia boa sem combinado não acontece. Um plano responde: o que vamos fazer, com quais materiais, quando, e quem é responsável por cada parte.","Quando ninguém fica responsável, cada um acha que outra pessoa vai resolver, e nada sai do lugar.","Faltou material? Antes de desistir, pergunte à escola e às famílias quem pode emprestar ou doar.","Também é preciso pensar com antecedência no que pedir e a quem: autorização da direção, reserva da quadra, horário com os professores."],"lembrar":"Plano = o quê, com o quê, quando e quem. Cada tarefa tem um responsável."},{"t":"6. Fazer durar e envolver mais gente","ps":["Muitas ações dão certo por um tempo e depois tudo volta a ser como antes. Para durar, é preciso um jeito de continuar: uma escala de turmas, um clube, uma comissão.","O 9º ano vai se formar. Convidar estudantes mais novos para participar garante que a ideia continue no ano seguinte.","Divulgar também faz diferença: mural, avisos nas salas, grupo das famílias e redes da escola. Quem conhece a ideia respeita e ajuda.","Contar a experiência, com fotos e resultados, pode inspirar outras turmas e até outras escolas."],"lembrar":"Para durar: revezamento, clube e novos participantes. Para envolver: divulgar."}],"qs":[{"t":"No grupo de mensagens da turma, Davi escreve todo dia que o bebedouro do corredor está quebrado há três semanas e que \"ninguém faz nada\". Todos concordam, mas nada muda. Qual atitude transforma essa reclamação em proposta?","o":["Levar à direção um bilhete dizendo qual bebedouro é e desde quando está quebrado","Seguir reclamando no grupo todos os dias até que alguém da direção fique sabendo","Combinar com a turma de não beber água na escola até o bebedouro ser trocado"],"s":0},{"t":"Na fila da merenda, alunos do 6º ano furam a fila todos os dias. Bia, do 9º ano, diz que \"a escola é uma bagunça\". A coordenadora pergunta à turma o que poderia ser feito. Qual resposta é uma proposta, e não só reclamação?","o":["Dizer que a culpa é toda dos alunos do 6º ano, que não respeitam ninguém na fila","Oferecer ajuda do 9º ano para organizar a fila, com um cartaz da ordem das turmas","Pedir que a merenda seja servida primeiro e só para o 9º ano, que respeita a fila"],"s":0},{"t":"Rafa acha que o maior problema da escola é a falta de tomadas para carregar o celular. Ele pergunta a 25 colegas o que mais incomoda: 3 citam as tomadas e 18 citam o calor nas salas da tarde. O que Rafa deve concluir?","o":["Que deve manter as tomadas, porque a ideia foi dele e ele conhece bem o assunto","Que a pesquisa deu errado, porque os colegas não entenderam a pergunta feita","Que o calor nas salas da tarde incomoda muito mais gente e merece prioridade"],"s":1},{"t":"O grêmio quer saber por que quase ninguém vai à biblioteca no recreio. Júlia observa três recreios e anota: a biblioteca abre 10 minutos depois do sinal e fecha antes de o intervalo acabar. Para que serviu essa observação?","o":["Para descobrir a causa real, que é o horário, e não a falta de interesse","Para provar que os estudantes da escola não gostam de ler e preferem o celular","Para Júlia passar o tempo do recreio, já que não tinha com quem conversar"],"s":1},{"t":"O 9º B vai propor melhorias para o pátio. Eles preparam três perguntas curtas e entregam a colegas de várias turmas, a duas merendeiras e ao porteiro. Por que incluir os funcionários na pesquisa?","o":["Porque funcionários são obrigados a responder a qualquer pesquisa feita na escola","Porque eles também vivem a escola e veem problemas que os alunos não percebem","Porque assim a pesquisa fica mais longa e parece mais importante para a direção"],"s":1},{"t":"A quadra da escola não tem cobertura e, nos dias de sol forte, as aulas de Educação Física são canceladas. O 9º A quer fazer algo ainda este mês, sem nenhum dinheiro. O que é possível?","o":["Juntar a turma num fim de semana e construir sozinha o telhado de toda a quadra","Desistir de vez, porque se não dá para cobrir a quadra não dá para fazer nada","Pedir a cobertura à direção e, até lá, propor atividades na sombra"],"s":2},{"t":"O banheiro feminino vive sem papel. Conversando com a diretora, as alunas descobrem que o papel é reposto todo dia, mas acaba logo no primeiro horário porque muita gente desperdiça. O que está ao alcance das estudantes?","o":["Fazer uma campanha contra o desperdício e conferir se o papel passa a durar mais","Exigir que a secretaria de educação mande o triplo de papel para a escola todo mês","Levar papel de casa e não se preocupar com o que acontece com as outras colegas"],"s":2},{"t":"Léo quer acabar com a violência no bairro da escola e propõe que o 9º ano resolva isso em dois meses. A professora diz que a preocupação é importante, mas o problema é grande demais para a turma. Qual seria um primeiro passo possível?","o":["Patrulhar as ruas do bairro depois da aula, em grupos, para afastar os perigos","Combinar a saída em grupos e pedir à direção um funcionário no portão na saída","Esquecer o assunto, porque violência é um problema só dos adultos e da polícia"],"s":2},{"t":"O 9º C contou cerca de 40 embalagens jogadas no chão do pátio depois de cada recreio e quer melhorar isso. Qual objetivo permite saber, no final, se o projeto deu certo?","o":["Deixar o pátio da escola bem mais bonito e agradável para todos","Conscientizar os estudantes sobre a importância do meio ambiente","Chegar a no máximo 20 embalagens no chão em até dois meses"],"s":3},{"t":"A turma fez uma campanha contra o barulho na biblioteca. No final, ninguém soube dizer se o barulho diminuiu. A professora perguntou o que faltou. Qual é a melhor resposta?","o":["Medir antes e depois, por exemplo contando as chamadas de atenção","Fazer cartazes maiores e mais coloridos, porque os primeiros eram pequenos","Desistir, porque campanhas sobre barulho nunca dão nenhum resultado"],"s":3},{"t":"Amanda propõe: \"Vamos diminuir o desperdício de comida\". O professor pede que ela deixe a proposta mais clara, para dar para conferir depois. Qual versão está melhor?","o":["Vamos tentar ao máximo não desperdiçar a comida no refeitório da escola","Reduzir de 15 para 7 os pratos com sobra por dia até o fim do bimestre","Vamos fazer todo mundo entender que desperdiçar comida é muito errado"],"s":3},{"t":"O grupo de Caio vai fazer uma campanha para que os livros da biblioteca sejam devolvidos no prazo. Antes de começar, eles querem algo que ajude a comparar o resultado depois. O que devem fazer primeiro?","o":["Escolher a cor dos cartazes que serão colados nos corredores da escola","Pedir que a bibliotecária pare de emprestar livros para quem atrasa","Perguntar à bibliotecária quantos livros estão atrasados hoje"],"s":3},{"t":"Cinco colegas combinaram arrumar a sala de leitura num sábado. No dia, ninguém apareceu: cada um achou que outro ia confirmar com o grupo. O que faltou no planejamento?","o":["Definir quem faz cada tarefa e quem confirma o dia com o grupo","Escolher uma sala de leitura menor, que fosse mais fácil de arrumar","Ter mais colegas no grupo, porque cinco pessoas é muito pouco"],"s":4},{"t":"O grupo de Ana quer fazer um mural sobre respeito no corredor. O objetivo está claro, mas ninguém sabe por onde começar. Qual plano está mais completo?","o":["Fazer o mural quando todo mundo do grupo tiver tempo livre e vontade de ajudar nele","Pedir o papel na segunda, desenhar na quarta e colar na sexta, com um responsável","Cada um faz uma parte do mural em casa e, no dia combinado, traz o que conseguiu fazer"],"s":4},{"t":"O 9º B planejou uma gincana para arrecadar livros para a biblioteca. Faltando dois dias, a turma percebeu que ninguém pediu autorização à direção nem reservou a quadra. O que essa situação ensina?","o":["Que gincanas são proibidas e não deveriam ser feitas dentro da escola","Que é melhor fazer tudo de improviso, sem planejar, para dar mais emoção","Que o plano precisa listar o que pedir, a quem e com quanta antecedência"],"s":4},{"t":"Para limpar o canteiro do jardim, o grupo precisa de luvas, sacos de lixo e uma enxada. Ninguém tem dinheiro para comprar. Qual saída é mais realista?","o":["Perguntar à escola e às famílias quem pode emprestar os materiais","Cancelar o projeto, porque sem dinheiro não existe nenhum projeto","Usar as mãos sem luva mesmo, porque é rápido e ninguém vai reparar"],"s":4},{"t":"A campanha \"Recreio sem lixo\" deu certo em outubro. Em dezembro, o pátio voltou a ficar sujo, porque o grupo parou de fazer as rondas. O que teria ajudado o resultado a durar?","o":["Fazer a campanha só uma vez por ano, para não cansar os colegas","Criar uma escala de turmas que revezam as rondas durante o ano","Proibir que os estudantes comam qualquer coisa durante o recreio"],"s":5},{"t":"O grupo de Pedro fez uma horta no pátio, mas os outros estudantes nem sabiam que ela existia, e muitos pisavam nos canteiros sem perceber. O que faltou?","o":["Colocar uma cerca alta e trancar a horta para ninguém mais entrar","Fazer a horta em outro lugar, bem longe de onde os alunos passam","Divulgar a horta e convidar outras turmas para cuidar dela juntas"],"s":5},{"t":"Os estudantes do 9º ano vão se formar, e o clube de leitura que eles criaram pode acabar. O que fazer para o clube continuar no ano que vem?","o":["Convidar alunos do 8º ano para participar e aprender a organizar","Encerrar o clube na formatura, porque ele era só da turma do 9º ano","Deixar os livros na sala e esperar que alguém tenha a ideia de seguir"],"s":5},{"t":"Na reunião de turma, a professora pergunta o que pode melhorar. Gabi diz: \"Tudo aqui é ruim\". Lucas diz: \"O ventilador da sala 5 está parado. Podemos pedir o conserto e, até lá, usar outra sala à tarde\". Por que a fala de Lucas ajuda mais?","o":["Porque Lucas falou mais alto e com mais segurança do que a colega Gabi","Porque aponta um problema concreto e já sugere o que pode ser feito","Porque ventilador é um assunto mais importante do que qualquer outro"],"s":0},{"t":"Muitos colegas reclamam que o sinal do recreio é alto demais e assusta. Marina decide escrever uma mensagem à direção. Qual mensagem tem mais chance de ser atendida?","o":["\"O sinal é horrível, ninguém aguenta mais, vocês precisam fazer algo já\"","\"Se o sinal não mudar, a turma vai parar de voltar do recreio na hora\"","\"Muitos colegas se assustam com o sinal. Daria para baixar o volume?\""],"s":2},{"t":"Tiago quer pedir mais bancos para o pátio. Antes, ele conta durante uma semana quantos estudantes ficam em pé no recreio: em média, 60 po function newState(nome,turma){return{nome,turma,start:Date.now(),end:null,status:'run',queue:shuf([...Array(NQ).keys()]),cur:null,serial:0,seen:[],first:{},tries:{},done:[],ans:[],alerts:[],consults:[],pauses:0,reloads:0,fastRun:0,fastTotal:0,phase:null,readLeft:0,releasedAt:0,pauseLeft:0,pauseKind:null,fb:null,code:null,registro:null};}
function serve(){
  if(!S.queue.length){finish();return;}
  const q=S.queue.shift();
  S.cur={q,ord:shuf([0,1,2]),ret:(S.tries[q]||0)>0};S.serial++;
  if(!S.seen.includes(q))S.seen.push(q);
  S.fb=null;S.sel=null;
  if(off){S.phase='answer';S.releasedAt=Date.now();}else{S.phase='read';S.readLeft=8000;}
  save();renderQuiz();
}
function ritmo(){const n=S.ans.length;if(!n)return['Leitura consciente','r'];const p=S.fastTotal/n;return p<.15?['Leitura consciente','r']:p<.35?['Ritmo apressado','r w']:['Leitura apressada','e'];}
function nota(){return Object.values(S.first).filter(Boolean).length;}
function errs(){return S.ans.filter(a=>!a.ok).length;}

  if(!resumed){el.innerHTML=`<div class="card"><h2>Você tem uma atividade em andamento</h2><p>${esc(S.nome)} · ${esc(S.turma)}</p><button class="btn" id="cont">Continuar</button></div>`;$('#cont').onclick=()=>{resumed=true;sqId();fs();if(!S.cur)serve();else renderQuiz();};return;}
  if(S.nuvem==='pend'&&!S.cur){el.innerHTML=nuvemHTML();$('#nsend').onclick=sendWords;$('#nskip').onclick=()=>{S.nuvem='pulou';save();serve();};return;}

  const q=D.qs[c.q],r=ritmo();

  const chip=(oi,di)=>{const right=S.fb&&off&&!S.fb.ok&&oi===SEC[c.q].a;return `<div class="chip ${S.phase==='feedback'?'dis':''} ${right?'right':''}" data-i="${di}" tabindex="0" role="button"><span class="l">${L[di]})</span><span>${esc(q.o[oi])}</span><span class="g">⋮⋮</span></div>`;};
  h+=`<div class="ins">Arraste para o campo abaixo a alternativa que você considera correta (ou toque nela).</div><div class="drop" id="drop">${S.sel!=null?chip(c.ord[S.sel],S.sel):'Solte aqui a sua resposta'}</div><div id="pool">`;
  c.ord.forEach((oi,di)=>{if(di!==S.sel)h+=chip(oi,di);});h+='</div>';

function bindChip(ch){const di=+ch.dataset.i,inDrop=!!ch.closest('#drop');

  ch.onpointerdown=e=>{if(e.button>0)return;e.preventDefault();const r=ch.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;let g=null;const drop=$('#drop');
    const over=(x,y)=>{const d=drop.getBoundingClientRect();return x>=d.left&&x<=d.right&&y>=d.top&&y<=d.bottom;};
    const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!g){g=ch.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);ch.classList.add('lift');}
      g.style.left=(r.left+ev.clientX-sx)+'px';g.style.top=(r.top+ev.clientY-sy)+'px';drop.classList.toggle('over',over(ev.clientX,ev.clientY));};

  <li>O anti-burla desativado volta a ficar ativo ao recarregar a página.</li></ul></div>`;
  $('#pq').onclick=profQs;$('#pr').onclick=()=>show('rel');$('#pc').onclick=profCode;
  $('#pa').onclick=()=>{off=!off;document.documentElement.classList.toggle('nb',!off);$('#banner').style.display=off?'block':'none';if(off&&S){S.pauseLeft=0;S.pauseKind=null;if(S.phase==='read'){S.phase='answer';S.releasedAt=Date.now();}save();closeOv();}profMenu();};
  $('#pn').onclick=()=>{if(confirm('Apagar o progresso deste navegador e liberar nova tentativa?')){S=null;resumed=false;try{localStorage.removeItem(K+'_s');localStorage.removeItem(K+'_nv');}catch(e){}location.reload();}};
  $('#ps').onclick=()=>show('quiz');}
function profQs(){const cnt=[0,0,0];SEC.forEach(s=>cnt[s.a]++);
  $('#pbody').innerHTML=`<div class="card"><p><b>Respostas por letra:</b> ${cnt.map((n,i)=>L[i]+' = '+n).join(' · ')}</p><input type="text" id="pf" placeholder="Filtrar questões"></div><div id="pl"></div>`;
  const draw=f=>{f=(f||'').toLowerCase();$('#pl').innerHTML=D.qs.map((q,i)=>({q,i})).filter(({q})=>!f||(q.t+q.o.join(' ')).toLowerCase().includes(f)).map(({q,i})=>`<div class="qc"><b>Nº no gabarito: ${i+1}</b> · Resposta: <span class="c">${L[SEC[i].a]}</span><p>${esc(q.t)}</p>${q.o.map((o,j)=>`<div class="${j===SEC[i].a?'c':''}">${L[j]}) ${esc(o)}</div>`).join('')}<p style="color:var(--mute);font-size:.9rem">Seção: ${esc(D.secs[q.s].t)}<br>Comentário: ${esc(SEC[i].c)}</p></div>`).join('');};
  draw();$('#pf').oninput=e=>draw(e.target.value);}
function profCode(){$('#pbody').innerHTML=`<div class="card"><label class="f">Linha "Registro" do relatório</label><input type="text" id="cr"><label class="f">Código</label><input type="text" id="cc"><div style="margin-top:10px"><button class="btn" id="cv">Conferir</button></div><p id="cres"></p></div>`;
  $('#cv').onclick=()=>{const ok=codeOf($('#cr').value)===$('#cc').value.trim().toUpperCase();$('#cres').innerHTML=ok?'<b style="color:var(--ok)">Código válido: o relatório não foi alterado.</b>':'<b style="color:var(--bad)">Código inválido: registro ou código não conferem.</b>';};}

show(S&&S.status==='run'?'quiz':'apo');
})();
</script>
